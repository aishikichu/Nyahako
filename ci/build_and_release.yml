name: Build and Release Nyahako

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Nyahako.exe
        run: |
          pyinstaller --onefile --noconsole --name "Nyahako" --icon "assets/icon.ico" --add-data "assets;assets" nyahako.pyw

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyahako-Windows-x64
          path: dist/Nyahako.exe

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nyahako.exe
          name: Nyahako ${{ github.ref_name }} 🐾
          draft: false
          prerelease: false
          generate_release_notes: true
